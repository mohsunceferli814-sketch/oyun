<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ayın Səthini Təmizləmək</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">
    <div id="hud-money">💰 0</div>
    <div id="hud-bag">🎒 0.00/1.00 kq</div>
  </div>
  <div id="version-tag">v0.9.4</div>

  <div id="minimap-box">
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="cleaned-percent">Təmizlənib: 0.0%</div>
    <div id="chunk-info">Parça: 0%</div>
    <div id="base-info">Baza: 0 m</div>
  </div>

  <div id="toast"></div>
  <div id="pc-hint"></div>

  <div id="shop-panel">
    <div id="shop-title">Yeniləmələr</div>
    <div id="shop-items"></div>
  </div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>
  <div id="camera-area"></div>
  <button id="action-btn" oncontextmenu="return false;">🪥</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
